services:
  db:
    image: postgres:16-alpine
    container_name: lamsa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lamsa
      POSTGRES_USER: lamsa_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lamsa_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./backend/migrations/002_seed_products.sql:/docker-entrypoint-initdb.d/002_seed_products.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamsa_user -d lamsa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lamsa-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: lamsa_user
      DB_PASSWORD: ${DB_PASSWORD:-lamsa_secret_2024}
      DB_NAME: lamsa
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-lamsa_jwt_secret_change_in_production}
      REFRESH_SECRET: ${REFRESH_SECRET:-lamsa_refresh_secret_change_in_production}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lamsa-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: lamsa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
